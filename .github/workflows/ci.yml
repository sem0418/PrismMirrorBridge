name: CI
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'test-results/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Windows x64 / Node 24
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
      - name: Offline conversion and transport tests
        run: npm test
      - name: CLI lifecycle without trust-store changes
        run: node scripts/smoke-test.mjs
